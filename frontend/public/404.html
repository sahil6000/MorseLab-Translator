<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORSELAB</title>
    <script>
      const basePath = '/MorseLab-Translator/'
      const requestedPath =
        window.location.pathname + window.location.search + window.location.hash

      sessionStorage.setItem('morselab-pages-redirect', requestedPath)
      window.location.replace(basePath)
    </script>
  </head>

    <p>Opening MORSELAB…</p>
  </body>
</html>
